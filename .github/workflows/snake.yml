name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          
          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=%23A855F7&color_dots=%230D0D0D%23261A35%2C%234C1D95%2C%237C3AED%2C%23A855F7&color_background=%230D0D0D
            dist/github-contribution-grid-snake.svg?color_snake=%23A855F7&color_dots=%230D0D0D%2C%23261A35%2C%234C1D95%2C%237C3AED%2C%23A855F7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A855F7&color_dots=%230D0D0D%2C%23261A35%2C%234C1D95%2C%237C3AED%2C%23A855F7

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
